# Type gate for the Python in this repo. Three independent components, so CI runs
# one check per component job (each env has that component's pinned deps, so typed
# third-party usage -- httpx, pydantic, mcp -- is really checked). From the repo root:
#   mypy tests
#   mypy enrichment-mcp
#   mypy ingestion
[mypy]
python_version = 3.12
# Strictness on top of the defaults. warn_return_any fires only inside annotated
# functions, so it is safe globally: pytest test functions are unannotated by
# convention and stay at mypy's default level.
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
# Never crawl the server's local venv, the yaraQA clone the CI job makes, or the
# scanned sample corpus (samples are hostile-looking content, not project code).
exclude = (?x)(^enrichment-mcp/\.venv/|^yaraqa-tool/|^corpus/)

# Source modules: fully annotated and fully checked. Listed concretely because a
# mypy per-module pattern's `*` can only be a whole dotted component ("test_*"
# would be a literal that matches nothing) -- add new non-test modules here.
[mypy-ruleset,retrohunt,server,ingestion,ingestion.cli,ingestion.enrich,ingestion.record,ingestion.store,ingestion.adapters,ingestion.adapters.feed,ingestion.adapters.scrape]
check_untyped_defs = true
disallow_untyped_defs = true

# Manual demo/eval scripts: bodies checked, unannotated defs tolerated.
[mypy-eval_harness,eval_cases,eval_live,investigate_demo,smoke_test]
check_untyped_defs = true

# Untyped third-party imports: yara-python is a C extension with no stubs,
# plyara ships no py.typed. (PyYAML is covered by types-PyYAML instead;
# dotenv, httpx, pydantic, mcp, bs4 and pytest all ship their own types.)
[mypy-yara.*,plyara.*]
ignore_missing_imports = true

# ingestion/enrich.py imports mcp lazily for its live path only; mcp is not an
# ingestion dep, so that job's run cannot resolve it. Harmless for the
# enrichment-mcp job: its install step guarantees mcp is present there.
[mypy-mcp.*]
ignore_missing_imports = true
